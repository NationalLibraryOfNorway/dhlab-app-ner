[project]
name = "dhlab-app-ner"
version = "0.1.0"
description = "DHLAB-appen Navn og Steder"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dhlab>=2.42.1",
    "streamlit>=1.51.0",
]

[dependency-groups]
dev = [
    "ruff>=0.14.3",
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]
